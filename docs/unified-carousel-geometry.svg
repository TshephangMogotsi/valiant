<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Unified carousel geometry states</title>
  <desc id="description">The same curved carousel panels close their gaps and then expand vertically to become a fullscreen black surface.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f4ec" />
      <stop offset="1" stop-color="#eee7da" />
    </linearGradient>
    <linearGradient id="ocean-a" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#161b39" />
      <stop offset="1" stop-color="#6e93a8" />
    </linearGradient>
    <linearGradient id="ocean-b" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#08152a" />
      <stop offset="1" stop-color="#c68a64" />
    </linearGradient>
    <linearGradient id="ocean-c" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#334b72" />
      <stop offset="1" stop-color="#121b37" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".12" />
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#paper)" />

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#123831">
    <text x="36" y="42" font-size="14" font-weight="700" letter-spacing="1.5">01 · ROTATING PANELS</text>
    <text x="420" y="42" font-size="14" font-weight="700" letter-spacing="1.5">02 · GAP = 0</text>
    <text x="804" y="42" font-size="14" font-weight="700" letter-spacing="1.5">03 · CURVES EXPAND</text>
  </g>

  <g transform="translate(24 64)" filter="url(#shadow)" stroke="#f8f4ec" stroke-width="4" stroke-linejoin="round">
    <path d="M0 25 Q42 47 79 69 L79 249 Q42 271 0 293 Z" fill="url(#ocean-a)" />
    <path d="M86 72 Q123 91 151 100 L151 218 Q123 227 86 246 Z" fill="url(#ocean-b)" />
    <path d="M158 103 Q191 113 222 116 L222 202 Q191 205 158 215 Z" fill="url(#ocean-c)" />
    <path d="M229 117 Q264 122 299 116 L299 202 Q264 196 229 201 Z" fill="url(#ocean-a)" />
    <path d="M306 113 Q339 103 360 89 L360 229 Q339 215 306 205 Z" fill="url(#ocean-b)" />
  </g>

  <g transform="translate(408 64)" fill="#000">
    <path d="M0 25 Q180 145 360 25 L360 293 Q180 173 0 293 Z" />
    <path d="M0 25 Q180 145 360 25" fill="none" stroke="#e36446" stroke-width="2" stroke-dasharray="7 7" />
    <path d="M0 293 Q180 173 360 293" fill="none" stroke="#e36446" stroke-width="2" stroke-dasharray="7 7" />
  </g>

  <g transform="translate(792 64)">
    <rect width="360" height="294" fill="#000" />
    <path d="M0 25 Q180 145 360 25 M0 293 Q180 173 360 293" fill="none" stroke="#e36446" stroke-width="2" stroke-dasharray="7 7" opacity=".75" />
    <path d="M180 145 V4 M180 173 V290" stroke="#fff" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fff" />
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#123831">
    <text x="24" y="390">Images and black bases share each panel path.</text>
    <text x="408" y="390">Neighboring endpoints become identical.</text>
    <text x="792" y="390">Those same edges become the viewport.</text>
  </g>
</svg>
